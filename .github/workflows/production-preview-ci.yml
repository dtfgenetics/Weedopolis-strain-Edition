name: Weedopolis Production Preview CI

on:
  pull_request:
    paths:
      - public/weedopolis-preview/**
      - src/games/weedopolis/**
      - data/board_map.csv
      - scripts/**
      - package.json
      - .github/workflows/production-preview-ci.yml
  push:
    branches:
      - main
    paths:
      - public/weedopolis-preview/**
      - src/games/weedopolis/**
      - data/board_map.csv
      - scripts/**
      - package.json
      - .github/workflows/production-preview-ci.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate game data and engine
        run: npm run validate
      - name: Validate production preview and SEO fallback
        run: npm run check:preview
      - name: Build self-contained production preview
        run: npm run build:preview
      - name: Verify deployable output
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/weedopolis/index.html
          test -s dist/weedopolis/style.css
          test -s dist/weedopolis/src/games/weedopolis/preview/app.js
          test -s dist/weedopolis/data/board_map.csv
          grep -Fq 'https://dtfseeds.com/games/weedopolis/' dist/weedopolis/index.html
          grep -Fq '<h1' dist/weedopolis/index.html
          grep -Fq 'src="./src/games/weedopolis/preview/app.js"' dist/weedopolis/index.html
      - name: Upload deployable artifact
        uses: actions/upload-artifact@v4
        with:
          name: weedopolis-${{ github.sha }}
          path: dist/weedopolis
          if-no-files-found: error
          retention-days: 14
