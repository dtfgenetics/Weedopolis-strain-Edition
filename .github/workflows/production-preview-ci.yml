name: Weedopolis Production Preview CI

on:
  pull_request:
    paths:
      - digital/weedopolis-web/**
      - public/weedopolis-preview/**
      - src/games/weedopolis/**
      - data/**
      - scripts/**
      - package.json
      - .github/workflows/production-preview-ci.yml
  push:
    branches:
      - main
    paths:
      - digital/weedopolis-web/**
      - public/weedopolis-preview/**
      - src/games/weedopolis/**
      - data/**
      - scripts/**
      - package.json
      - .github/workflows/production-preview-ci.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate game data and engine
        run: npm run validate
      - name: Validate recovered production web build
        run: npm run check:preview
      - name: Build self-contained production preview
        run: npm run build:preview
      - name: Verify deployable Weedopolis V1 output
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/weedopolis/index.html
          test -s dist/weedopolis/styles.css
          test -s dist/weedopolis/approved-assets.css
          test -s dist/weedopolis/runtime-assets.css
          test -s dist/weedopolis/master-board-overlay.css
          test -s dist/weedopolis/js/weedopolis-edition.js
          test -s dist/weedopolis/js/weedopolis-master-overrides.js
          test -s dist/weedopolis/js/weedopolis-assets.js
          test -s dist/weedopolis/js/weedopolis-engine.js
          test -s dist/weedopolis/js/weedopolis-ui.js
          test -s dist/weedopolis/assets/asset-manifest.json
          test -s dist/weedopolis/assets/board/weedopolis-master-board.webp
          grep -Fq 'https://dtfseeds.com/games/weedopolis/' dist/weedopolis/index.html
          grep -Fq 'data-ui-standard="premium-responsive-shell-v1"' dist/weedopolis/index.html
          grep -Fq 'data-art-standard="weedopolis-v1-master"' dist/weedopolis/index.html
          grep -Fq 'js/weedopolis-assets.js' dist/weedopolis/index.html
          grep -Fq "assets/board/weedopolis-master-board.webp" dist/weedopolis/master-board-overlay.css
          grep -Fq 'expectedOwnershipCards: 28' dist/weedopolis/js/weedopolis-assets.js
          if test -d dist/weedopolis/assets/board/v1-master-b64; then
            echo 'Source-only board transport chunks leaked into production output.' >&2
            exit 1
          fi
      - name: Upload deployable artifact
        uses: actions/upload-artifact@v4
        with:
          name: weedopolis-${{ github.sha }}
          path: dist/weedopolis
          if-no-files-found: error
          retention-days: 14
